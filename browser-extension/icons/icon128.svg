<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007ACC"/>
      <stop offset="100%" stop-color="#005A9E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background Container -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  
  <!-- Code File Icon -->
  <g transform="translate(32, 28)" filter="url(#shadow)">
    <!-- Main page -->
    <path d="M0 0 H44 L64 20 V72 H0 Z" fill="#ffffff"/>
    <!-- Folded corner -->
    <path d="M44 0 V20 H64" fill="#E0E0E0"/>
    
    <!-- Code Brackets Symbol -->
    <path d="M16 28 L8 36 L16 44 M48 28 L56 36 L48 44 M24 36 L40 36" 
          stroke="#007ACC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Drag/Drop Arrow Indicator -->
  <g transform="translate(86, 86)">
    <circle r="24" fill="#2E7D32" filter="url(#shadow)"/>
    <path d="M0 -10 V 10 M -8 2 L 0 10 L 8 2" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(0, 0)"/>
  </g>
</svg>